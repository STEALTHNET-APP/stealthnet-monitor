name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal && rustup default 1.94.0
      - name: Dependencies
        run: npm --prefix web ci
      - name: Checks
        run: make test
      - name: Rust formatting
        run: rustup component add rustfmt && cargo fmt --all --check
